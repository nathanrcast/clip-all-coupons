# Serve the family guide page + bookmarklets publicly so phones can reach them.
# Userscript installs come from GitHub raw (see index.html) — not this host.
# Run this from inside the browser/ dir (the volume mounts ./ as the docroot).
#   1. Point a Cloudflare Tunnel hostname at http://web:80.
#   2. Put the tunnel token in a .env file next to this:  TUNNEL_TOKEN=...
#   3. docker compose -f deploy.compose.yml up -d
# Then share the tunnel's public URL with whoever should use it.
#
# Optional LAN port: uncomment the web.ports block (or use a compose override).
services:
  web:
    image: nginx:1.27-alpine
    container_name: coupon-clipper-web
    restart: unless-stopped
    volumes:
      - ./:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    # ports:
    #   - "8551:80"   # optional LAN access; tunnel is enough for family phones

  cloudflared:
    image: cloudflare/cloudflared:2025.2.1
    container_name: coupon-clipper-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    depends_on:
      - web
