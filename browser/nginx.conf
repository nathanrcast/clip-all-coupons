# Static family guide — allowlist only (no probes / sources / compose).
# Mounted into nginx:alpine at /etc/nginx/conf.d/default.conf
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers for the static guide.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

    # Deny tooling / sources that should not be public.
    location ~* (probe\.js|bookmarklet\.src\.js|build-bookmarklet\.sh|deploy\.compose\.yml|nginx\.conf|\.env)$ {
        deny all;
        return 404;
    }

    # Userscripts: install from GitHub raw (guide links there). Keep local copies
    # off the public host so this tunnel is not a mutable CDN.
    location ~* \.user\.js$ {
        deny all;
        return 404;
    }

    location = / {
        try_files /index.html =404;
    }

    location = /index.html {
        try_files $uri =404;
    }

    # Bookmarklets for iOS copy-to-clipboard.
    location ~* ^/(bookmarklet|kroger-bookmarklet)\.txt$ {
        default_type text/plain;
        try_files $uri =404;
    }

    # Everything else: not found.
    location / {
        return 404;
    }
}
